
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Quiz Challenge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            max-width: 800px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-weight: bold;
            min-width: 120px;
            text-align: center;
        }

        .combo {
            transition: all 0.3s ease;
        }

        .combo.glow {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.6);
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .timer-container {
            text-align: center;
            margin-bottom: 2rem;
        }

        .timer {
            font-size: 3rem;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            transition: all 0.3s ease;
        }

        .timer.warning {
            background: linear-gradient(45deg, #ff4757, #ff3838);
            animation: shake 0.5s ease-in-out infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .question-container {
            margin-bottom: 2rem;
        }

        .question {
            font-size: 1.3rem;
            text-align: center;
            margin-bottom: 2rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            line-height: 1.6;
        }

        .answers {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .answer-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 1rem;
            border-radius: 15px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            min-height: 80px;
            display: flex;
            align-items: center;
        }

        .answer-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .answer-btn.correct {
            background: linear-gradient(45deg, #2ed573, #1e90ff);
            border-color: #2ed573;
            animation: correctPulse 0.6s ease-in-out;
        }

        .answer-btn.wrong {
            background: linear-gradient(45deg, #ff4757, #ff3838);
            border-color: #ff4757;
            animation: wrongShake 0.6s ease-in-out;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes wrongShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .game-over {
            text-align: center;
            display: none;
        }

        .final-score {
            font-size: 3rem;
            margin: 1rem 0;
            color: #feca57;
        }

        .play-again-btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            border: none;
            color: white;
            padding: 1rem 2rem;
            border-radius: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s ease;
        }

        .play-again-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        @media (max-width: 600px) {
            .answers {
                grid-template-columns: 1fr;
            }
            
            .stats {
                justify-content: center;
            }
            
            .title {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1 class="title">🗄️ Programming Quiz Challenge</h1>
        </div>

        <div class="game-area">
            <div class="stats">
                <div class="stat-item">Score: <span id="score">0</span></div>
                <div class="stat-item combo" id="combo-display">Combo: <span id="combo">0</span></div>
                <div class="stat-item">Question: <span id="question-num">1</span>/10</div>
                <div class="stat-item">Best: <span id="high-score">0</span></div>
            </div>

            <div class="timer-container">
                <div class="timer" id="timer">10</div>
            </div>

            <div class="question-container">
                <div class="question" id="question-text"></div>
                <div class="answers" id="answers-container"></div>
            </div>
        </div>

        <div class="game-over" id="game-over">
            <h2>🎉 Quiz Complete!</h2>
            <div class="final-score" id="final-score">0</div>
            <p id="score-message"></p>
            <button class="play-again-btn" onclick="startGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Game state variables
        let currentQuestion = 0;
        let score = 0;
        let combo = 0;
        let timeLeft = 10;
        let timerInterval;
        let gameActive = false;
        let questionLock = false;

        // Audio context for sounds
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();

        // Quiz questions
        // Quiz questions (Pandas version)
        const questions = [
            {
                question: "Why Pandas?",
                answers: [
                    "Simple data merging, Pandas can cope with missing values",
                    "To create graphical user interfaces for applications",
                    "To run Python programs faster than normal execution",
                    "To replace all built-in Python data structures"
                ],
                correct: 0
            },
            {
                question: "What is Pandas derived from?",
                answers: [
                    "Parallel Data / Python Development System",
                    "Panel Data / Python Data Analysis",
                    "Program Data / Python Design Algorithm",
                    "Process Data / Python Database Access"
                ],
                correct: 1
            },
            {
                question: "What is Pandas in Python?",
                answers: [
                    "A Python library used for data manipulation and analysis",
                    "A programming language used for web development",
                    "A tool used only for creating graphics and animations",
                    "A database system used to store large datasets"
                ],
                correct: 0
            },
            {
                question: "Pandas represent data in the form of ...",
                answers: [
                    "Arrays and matrices",
                    "Lists and dictionaries",
                    "Series and DataFrame",
                    "Rows and columns only"
                ],
                correct: 2
            },
            {
                question: "What is Series in Python?",
                answers: [
                    "A structure that stores only numeric values",
                    "A two-dimensional table with rows and columns",
                    "A function used to perform calculations on data",
                    "A one-dimensional labeled array holding data of any type such as integers, strings, Python objects etc."
                ],
                correct: 3
            },
            {
                question: "What is DataFrame in Python?",
                answers: [
                    "A two-dimensional data structure that holds data like a two-dimensional array or a table with rows and columns",
                    "A one-dimensional array of data values",
                    "A function used to read files in Python",
                    "A data type that stores only text values"
                ],
                correct: 0
            },
            {
                question: "What is the usage of timedelta[ns] in Python?",
                answers: [
                    "Stores only date values without time",
                    "Differences between two datetimes",
                    "Converts strings into datetime format",
                    "Displays the current system time"
                ],
                correct: 1
            },
            {
                question: "What is the usage of category in Python?",
                answers: [
                    "Used to perform mathematical calculations",
                    "Stores unlimited numeric values only",
                    "Finite list of text values",
                    "Converts numbers into strings automatically"
                ],
                correct: 2
            },
            {
                question: "\"import pandas as pd\" What is the pd?",
                answers: [
                    "Alias",
                    "A predefined function in Pandas",
                    "A variable that stores data",
                    "A class used to create DataFrames"
                ],
                correct: 0
            },
            {
                question: "How to get summary of the DataFrame in Python?",
                answers: [
                    "df.show()",
                    "df.summary()",
                    "df.describe_all()",
                    "df.info()"
                ],
                correct: 3
            }
        ];

        // Sound generation functions
        function playSound(frequency, duration, type = 'sine') {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            oscillator.type = type;
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        function playCorrectSound() {
            playSound(523, 0.2); // C note
            setTimeout(() => playSound(659, 0.2), 100); // E note
            setTimeout(() => playSound(784, 0.3), 200); // G note
        }

        function playWrongSound() {
            playSound(200, 0.5, 'sawtooth');
        }

        function playAlarmSound() {
            playSound(800, 0.1);
            setTimeout(() => playSound(600, 0.1), 100);
        }

        // Initialize game
        function startGame() {
            currentQuestion = 0;
            score = 0;
            combo = 0;
            gameActive = true;
            questionLock = false;
            
            // Load high score
            const savedHighScore = localStorage.getItem('dbQuizHighScore') || 0;
            document.getElementById('high-score').textContent = savedHighScore;
            
            // Hide game over screen
            document.getElementById('game-over').style.display = 'none';
            document.querySelector('.game-area').style.display = 'block';
            
            updateDisplay();
            showQuestion();
        }

        function updateDisplay() {
            document.getElementById('score').textContent = score;
            document.getElementById('combo').textContent = combo;
            document.getElementById('question-num').textContent = currentQuestion + 1;
            
            // Update combo glow effect
            const comboDisplay = document.getElementById('combo-display');
            comboDisplay.classList.remove('glow');
            if (combo >= 3) {
                comboDisplay.classList.add('glow');
            }
        }

        function showQuestion() {
            if (currentQuestion >= questions.length) {
                endGame();
                return;
            }

            // Reset UI state
            const timer = document.getElementById('timer');
            timer.classList.remove('warning');
            
            // Clear any existing timer
            if (timerInterval) {
                clearInterval(timerInterval);
            }

            // Reset question lock and game state
            questionLock = false;
            gameActive = true;
            timeLeft = 10;

            const question = questions[currentQuestion];
            document.getElementById('question-text').textContent = question.question;

            // Create answer buttons
            const answersContainer = document.getElementById('answers-container');
            answersContainer.innerHTML = '';

            question.answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.className = 'answer-btn';
                button.textContent = `${String.fromCharCode(65 + index)}. ${answer}`;
                button.onclick = () => handleAnswer(index);
                answersContainer.appendChild(button);
            });

            // Start timer
            startTimer();
            updateDisplay();
        }

        function startTimer() {
            const timerElement = document.getElementById('timer');
            timerElement.textContent = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;

                if (timeLeft <= 3 && timeLeft > 0) {
                    timerElement.classList.add('warning');
                    playAlarmSound();
                }

                if (timeLeft <= 0) {
                    handleAnswer(-1); // Timeout
                }
            }, 1000);
        }

        function handleAnswer(selectedIndex) {
            // Prevent multiple executions
            if (!gameActive || questionLock) return;
            questionLock = true;

            // Clear timer
            clearInterval(timerInterval);
            gameActive = false;

            const question = questions[currentQuestion];
            const buttons = document.querySelectorAll('.answer-btn');
            
            // Remove any existing classes
            buttons.forEach(btn => {
                btn.classList.remove('correct', 'wrong');
            });

            let isCorrect = selectedIndex === question.correct;

            if (selectedIndex === -1) {
                // Timeout - treat as wrong
                isCorrect = false;
            }

            if (isCorrect) {
                // Correct answer
                if (selectedIndex >= 0) {
                    buttons[selectedIndex].classList.add('correct');
                }
                
                // Calculate score with time bonus
                const basePoints = 100;
                const timeBonus = timeLeft * 10;
                const comboBonus = combo >= 3 ? combo * 50 : 0;
                const totalPoints = basePoints + timeBonus + comboBonus;
                
                score += totalPoints;
                combo++;
                
                playCorrectSound();
            } else {
                // Wrong answer or timeout
                if (selectedIndex >= 0) {
                    buttons[selectedIndex].classList.add('wrong');
                }
                
                // Show correct answer
                buttons[question.correct].classList.add('correct');
                
                combo = 0;
                playWrongSound();
            }

            updateDisplay();

            // Move to next question after delay
            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    showQuestion();
                } else {
                    endGame();
                }
            }, 2000);
        }

        function endGame() {
            document.querySelector('.game-area').style.display = 'none';
            document.getElementById('game-over').style.display = 'block';
            
            document.getElementById('final-score').textContent = score;
            
            // Check and save high score
            const currentHighScore = parseInt(localStorage.getItem('dbQuizHighScore') || 0);
            let message = '';
            
            if (score > currentHighScore) {
                localStorage.setItem('dbQuizHighScore', score);
                message = '🎉 New High Score! Amazing work!';
            } else if (score >= currentHighScore * 0.8) {
                message = '🔥 Great job! You\'re getting close to your best!';
            } else {
                message = '💪 Good effort! Try again to beat your high score!';
            }
            
            document.getElementById('score-message').textContent = message;
        }

        // Start the game when page loads
        window.onload = () => {
            startGame();
        };
    </script>

</html>
